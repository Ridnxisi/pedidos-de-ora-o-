<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedido de Oração</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef6ff,#f7f0ff);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;color:#25324a}.card{background:#fff;max-width:540px;width:100%;padding:32px;border-radius:24px;box-shadow:0 12px 35px #0002;text-align:center}.icon{font-size:48px}h1{margin:8px 0 10px}p{color:#687386;line-height:1.5}textarea{width:100%;height:190px;padding:15px;border:1px solid #ccd3df;border-radius:14px;font:16px Arial;resize:vertical;outline:none}textarea:focus{border-color:#6658e8}button{width:100%;margin-top:16px;padding:16px;border:0;border-radius:14px;background:#6658e8;color:white;font-size:16px;font-weight:bold;cursor:pointer}button:disabled{opacity:.6}.msg{display:none;margin-top:16px;padding:12px;border-radius:10px;background:#eef8f0;color:#28643a;font-weight:bold}
</style>
</head>
<body>
<div class="card">
<div class="icon">🙏</div>
<h1>Pedido de Oração</h1>
<p>Escreva seu pedido de oração. Sua mensagem será enviada para a pessoa responsável.</p>

<form id="form">
<textarea id="pedido" name="pedido" placeholder="Escreva aqui seu pedido de oração..." required></textarea>
<button id="btn" type="submit">Enviar pedido 🙏</button>
</form>
<div class="msg" id="msg">Pedido enviado com sucesso! 🙏</div>
<p style="font-size:12px">Seu pedido será enviado de forma privada.</p>
</div>

<script>
const form=document.getElementById('form');
const btn=document.getElementById('btn');
const msg=document.getElementById('msg');

form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  const pedido=document.getElementById('pedido').value.trim();
  if(!pedido)return;
  btn.disabled=true;
  btn.textContent='Enviando...';

  // O formulário usa o endpoint do FormSubmit.
  // Na primeira utilização, o serviço envia uma confirmação para o e-mail.
  const data=new FormData();
  data.append('Pedido de oração',pedido);
  data.append('_subject','Novo pedido de oração');
  data.append('_captcha','false');
  data.append('_template','table');

  try{
    const response=await fetch('https://formsubmit.co/ajax/silvanuneselberth@gmail.com',{
      method:'POST',
      body:data,
      headers:{'Accept':'application/json'}
    });
    if(!response.ok) throw new Error();
    form.style.display='none';
    msg.style.display='block';
  }catch(err){
    btn.disabled=false;
    btn.textContent='Enviar pedido 🙏';
    alert('Não foi possível enviar agora. Verifique a conexão com a internet e tente novamente.');
  }
});
</script>
</body>
</html>
